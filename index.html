<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حِرفة - HERFA | من إيدك للسوق</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDarkGreen: '#1b4332',
                        brandLightGreen: '#2d6a4f',
                        brandBeige: '#fdfbf7',
                        brandAccent: '#d4a373'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brandBeige text-gray-800 flex flex-col min-h-screen">

    <!-- الهيدر -->
    <header class="bg-brandDarkGreen text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">حِرفة <span class="text-brandAccent text-xs font-normal">HERFA</span></h1>
                <p class="text-[10px] text-gray-300">من إيدك للسوق ومن فكرتك لمشروع</p>
            </div>
            <div id="authButtons" class="flex gap-2">
                <button type="button" onclick="openModal('loginModal')" class="bg-brandAccent text-brandDarkGreen px-3 py-1.5 rounded-lg text-xs font-semibold hover:opacity-90 transition">دخول</button>
                <button type="button" onclick="openModal('registerModal')" class="bg-white text-brandDarkGreen px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-gray-100 transition">حساب جديد</button>
            </div>
            <div id="userInfo" class="hidden flex items-center gap-2">
                <span id="userName" class="text-xs font-medium"></span>
                <button type="button" onclick="logout()" class="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-700 transition">خروج</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-12 flex-grow">
        <div class="text-center max-w-xl mx-auto py-8">
            <h2 class="text-2xl md:text-3xl font-bold text-brandDarkGreen mb-3">السوق المصري المتكامل للحرف اليدوية والخامات</h2>
            <p class="text-sm text-gray-600 mb-6">منصة تجمع الحرفيين، الموردين، العملاء، وشركات الشحن في مكان واحد.</p>
            <div class="flex justify-center gap-3">
                <button type="button" onclick="openModal('registerModal')" class="bg-brandDarkGreen text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-sm hover:bg-brandLightGreen transition">انضمي إلينا الآن</button>
            </div>
        </div>
    </main>

    <!-- نافذة تسجيل الدخول -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-lg">
            <h3 class="text-lg font-bold mb-4 text-brandDarkGreen">تسجيل الدخول</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium mb-1">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brandDarkGreen">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-brandDarkGreen">
                </div>
                <div class="flex justify-between items-center text-xs">
                    <button type="button" onclick="switchModal('loginModal', 'forgotModal')" class="text-brandLightGreen hover:underline">نسيت كلمة المرور؟</button>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('loginModal')" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">إلغاء</button>
                    <button type="submit" class="bg-brandDarkGreen text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-brandLightGreen transition">دخول</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة إنشاء حساب جديد -->
    <div id="registerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-lg">
            <h3 class="text-lg font-bold mb-4 text-brandDarkGreen">إنشاء حساب جديد في حِرفة</h3>
            <form onsubmit="handleRegister(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium mb-1">الاسم الكامل</label>
                    <input type="text" id="regFullName" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-brandDarkGreen">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">البريد الإلكتروني</label>
                    <input type="email" id="regEmail" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-brandDarkGreen">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">كلمة المرور</label>
                    <input type="password" id="regPassword" required minlength="6" class="w-full border border
