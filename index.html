<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حِرفة - HERFA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDarkGreen: '#1b4332',
                        brandLightGreen: '#2d6a4f',
                        brandBeige: '#fdfbf7',
                        brandAccent: '#d4a373'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brandBeige text-gray-800 flex flex-col min-h-screen">

    <!-- الهيدر -->
    <header class="bg-brandDarkGreen text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">حِرفة <span class="text-brandAccent text-xs font-normal">HERFA</span></h1>
            </div>
            <div id="authButtons" class="flex gap-2">
                <button type="button" onclick="openModal('loginModal')" class="bg-brandAccent text-brandDarkGreen px-3 py-1.5 rounded-lg text-xs font-semibold">دخول</button>
                <button type="button" onclick="openModal('registerModal')" class="bg-white text-brandDarkGreen px-3 py-1.5 rounded-lg text-xs font-semibold">حساب جديد</button>
            </div>
            <div id="userInfo" class="hidden flex items-center gap-2">
                <span id="userName" class="text-xs font-medium"></span>
                <button type="button" onclick="logout()" class="bg-red-600 text-white px-2 py-1 rounded text-xs">خروج</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <div class="text-center py-12">
            <h2 class="text-2xl font-bold text-brandDarkGreen mb-3">مرحباً بكِ في منصة حِرفة المصرية</h2>
            <p class="text-sm text-gray-600 mb-6">سوق الحرف اليدوية والخامات الأول</p>
            <div class="flex justify-center gap-3">
                <button type="button" onclick="openModal('registerModal')" class="bg-brandDarkGreen text-white px-5 py-2.5 rounded-xl text-sm font-bold">انضمي إلينا الآن</button>
            </div>
        </div>
    </main>

    <!-- نافذة تسجيل الدخول -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-lg font-bold mb-4 text-brandDarkGreen">تسجيل الدخول</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium mb-1">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('loginModal')" class="px-4 py-2 text-sm text-gray-600">إلغاء</button>
                    <button type="submit" class="bg-brandDarkGreen text-white px-5 py-2 rounded-lg text-sm font-semibold">دخول</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة حساب جديد -->
    <div id="registerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-4 text-brandDarkGreen">إنشاء حساب جديد</h3>
            <form onsubmit="handleRegister(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium mb-1">الاسم الكامل</label>
                    <input type="text" id="regFullName" required class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">البريد الإلكتروني</label>
                    <input type="email" id="regEmail" required class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">كلمة المرور</label>
                    <input type="password" id="regPassword" required class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">نوع الحساب</label>
                    <select id="regRole" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                        <option value="customer">عميل</option>
                        <option value="craftsman">حرفي / صاحب ورشة</option>
                        <option value="supplier">مورد خامات</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('registerModal')" class="px-4 py-2 text-sm text-gray-600">إلغاء</button>
                    <button type="submit" class="bg-brandDarkGreen text-white px-5 py-2 rounded-lg text-sm font-semibold">تسجيل</button>
                </div>
            </form>
        </div>
    </div>

    <!-- السكريبت البرمجي -->
    <script>
        const SUPABASE_URL = 'https://einfthdzxglylumqpxss.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_1YokFOqSMSzCKV36TGsZjQ_cy9pRaxE';
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const fullName = document.getElementById('regFullName').value;
            const role = document.getElementById('regRole').value;

            try {
                const { data, error } = await _supabase.auth.signUp({ email, password });
                if (error) throw error;

                if (data.user) {
                    await _supabase.from('profiles').insert([{
                        id: data.user.id,
                        full_name: fullName,
                        role: role
                    }]);
                    alert("تم إنشاء الحساب بنجاح!");
                    closeModal('registerModal');
                }
            } catch (err) {
                alert("خطأ في التسجيل: " + err.message);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                alert("تم تسجيل الدخول بنجاح!");
                closeModal('loginModal');
                checkUser();
            } catch (err) {
                alert("خطأ في الدخول: " + err.message);
            }
        }

        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                document.getElementById('authButtons').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userName').textContent = user.email;
            } else {
                document.getElementById('authButtons').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            checkUser();
        }

        window.onload = checkUser;
    </script>
</body>
</html>
