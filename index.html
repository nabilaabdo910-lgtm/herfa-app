<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حِرفة - HERFA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-3xl font-black text-amber-500 tracking-wider">حِرفة</span>
                <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full font-bold">HERFA</span>
            </div>
            <div id="authButtons" class="flex gap-2">
                <button onclick="openModal('login')" class="px-4 py-2 text-sm font-semibold text-slate-200 hover:text-white transition">دخول</button>
                <button onclick="openModal('register')" class="px-4 py-2 text-sm font-semibold bg-amber-500 text-slate-950 rounded-lg hover:bg-amber-400 transition shadow-lg shadow-amber-500/20">حساب جديد</button>
            </div>
            <div id="userMenu" class="hidden flex items-center gap-4">
                <span id="userNameDisplay" class="text-sm font-medium text-amber-400"></span>
                <button onclick="handleLogout()" class="px-3 py-1.5 text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition">تسجيل الخروج</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12 flex-grow w-full text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-4 leading-tight">
            منصة <span class="text-amber-500">حِرفة</span> لإدارة وتوصيل الأعمال الحرفية
        </h1>
        <p class="text-slate-400 text-lg max-w-2xl mx-auto mb-8">
            الملتقى المتكامل للعملاء، الحرفيين، موردي المواد الخام، وشركات الشحن.
        </p>
        <button onclick="openModal('register')" class="px-8 py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-2xl text-lg shadow-xl shadow-amber-500/20 transition">
            ابدأ الانضمام لمنصة حِرفة
        </button>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>© 2026 منصة حِرفة - جميع الحقوق محفوظة</p>
    </footer>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-xl">✕</button>
            
            <!-- Login Form -->
            <div id="loginForm" class="space-y-4">
                <h2 class="text-2xl font-bold text-white mb-6">تسجيل الدخول في حِرفة</h2>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition">دخول</button>
                <p class="text-xs text-center text-slate-400 mt-4">ليس لديك حساب؟ <button onclick="switchTab('register')" class="text-amber-400 underline">إنشاء حساب جديد</button></p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="space-y-4 hidden">
                <h2 class="text-2xl font-bold text-white mb-6">إنشاء حساب جديد في حِرفة</h2>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">الاسم الكامل</label>
                    <input type="text" id="regName" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="نبيلة عبدالرحمن">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="regEmail" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" id="regPassword" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">نوع الحساب (الدور)</label>
                    <select id="regRole" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
                        <option value="customer">عميل (مشتري)</option>
                        <option value="craftsman">حرفي (صانع)</option>
                        <option value="supplier">مورد مواد خام</option>
                        <option value="shipping">شركة شحن</option>
                    </select>
                </div>
                <button onclick="handleRegister()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition">إنشاء الحساب</button>
                <p class="text-xs text-center text-slate-400 mt-4">لديك حساب بالفعل؟ <button onclick="switchTab('login')" class="text-amber-400 underline">تسجيل الدخول</button></p>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = "https://bowzzihtrykoemvprjw.supabase.co";
        const SUPABASE_ANON_KEY = "Sb_publishable_1YokFOqSMSzCKV36TGsZjQ_cy9pRaxE";
        
        // إعداد العميل مع ضبط الاتصال لتفادي مشاكل الحظر
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false
            }
        });

        function openModal(type) {
            document.getElementById('authModal').classList.remove('hidden');
            switchTab(type);
        }

        function closeModal() {
            document.getElementById('authModal').classList.add('hidden');
        }

        function switchTab(type) {
            if (type === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const role = document.getElementById('regRole').value;

            if(!email || !password || !name) {
                alert("برجاء إدخال جميع البيانات المطلوبة");
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { full_name: name, role: role }
                    }
                });

                if (error) throw error;

                alert("تم إنشاء الحساب بنجاح!");
                closeModal();
                checkUser();
            } catch (err) {
                alert("خطأ في الاتصال أو إنشاء الحساب: " + (err.message || "تأكد من الانترنت"));
            }
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                alert("تم تسجيل الدخول بنجاح!");
                closeModal();
                checkUser();
            } catch (err) {
                alert("خطأ أثناء تسجيل الدخول: " + err.message);
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            checkUser();
        }

        async function checkUser() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    document.getElementById('authButtons').classList.add('hidden');
                    document.getElementById('userMenu').classList.remove('hidden');
                    document.getElementById('userNameDisplay`').innerText = `أهلاً، ${user.user_metadata?.full_name || user.email}`;
                } else {
                    document.getElementById('authButtons').classList.remove('hidden');
                    document.getElementById('userMenu').classList.add('hidden');
                }
            } catch(e) {
                console.log(e);
            }
        }

        checkUser();
    </script>
</body>
</html>
